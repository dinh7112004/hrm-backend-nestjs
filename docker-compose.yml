version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: attendance_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: attendance_api  
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/attendance
      - JWT_SECRET=super-secret-key

volumes:
  mongo_data: